name: Build NRSA Steel for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: false
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer and portable EXE
        run: npm run dist
      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NRSA-Steel-Windows
          path: dist/*
